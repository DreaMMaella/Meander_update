name: mnd_player
description: Full-featured Meander quest player. Ported from main_app GameScreen.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.9.2
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  mnd_core:
    path: ../mnd_core
  flutter_riverpod: ^2.5.1
  audioplayers: ^6.0.0
  markdown_widget: ^2.3.1
  photo_view: ^0.15.0
  url_launcher: ^6.2.6
  path_provider: ^2.0.15
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.7.0
  expressions: ^0.2.5+3
  crypto: ^3.0.7
  uuid: ^4.6.0
  archive: ^4.0.7
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  google_fonts: ^8.2.1
  # media_kit_video 2.0.1 — единственный релиз с починкой h/w-рендера на Linux
  # для Flutter >= 3.38 (upstream #1290, #1325): раньше GL-контекст не делался
  # current, и фон-видео рисовало синей текстурой. Нижняя планка media_kit
  # продиктована самим 2.0.1.
  media_kit: ^1.2.3
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.4
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Только для тестов с реальным FFI (`ScriptExecutor.evaluateExpression`).
  flutter_rust_bridge: 2.12.0
