[package]
name = "mnd-ffi"
description = "C ABI bridge between mnd-core and Flutter (flutter_rust_bridge target)."
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]
name = "mnd_ffi"

[dependencies]
mnd-core = { path = "../mnd-core", default-features = false }
mnd-plugin = { path = "../mnd-plugin", default-features = false }
flutter_rust_bridge = "=2.12.0"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

# Набор фич здесь, а не в mnd-core/mnd-plugin, потому что это единственный
# крейт, который собирается и в .so/.dll, и в .wasm: `cargo build -p mnd-ffi`
# = нативная сборка как раньше, `cargo build -p mnd-ffi --target
# wasm32-unknown-unknown --no-default-features` = веб.
[features]
default = ["desktop"]
desktop = [
  "mnd-core/lua-scripting",
  "mnd-core/image-convert",
  "mnd-core/http-request",
  "mnd-core/posix-locale",
  "mnd-plugin/lua-runtime",
]
