[package]
name = "mnd-tui"
description = "Terminal UI player for Meander quests, built on top of the mnd-core engine."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mnd-core = { path = "../mnd-core" }
ratatui = "0.29"
crossterm = "0.28"
serde_json = { workspace = true }
zip = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
textwrap = "0.16"
